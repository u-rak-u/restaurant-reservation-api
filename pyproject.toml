[project]
name = "restaurant-reservation-api"
version = "0.1.0"
description = "飲食店向けの店舗予約管理API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "starlette>=1.2,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<10.0",
]

[tool.uv]
package = false
